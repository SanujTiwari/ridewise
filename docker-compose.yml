version: '3.8'

services:
  backend:
    build: .
    container_name: ridewise_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ridewise_user:ridewise_password@postgres:5432/ridewise_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=ridewise_production_jwt_secret_key_2026
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: ridewise_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ridewise_user
      - POSTGRES_PASSWORD=ridewise_password
      - POSTGRES_DB=ridewise_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ridewise_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
